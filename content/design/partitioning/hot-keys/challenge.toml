id = "hot-keys"
title = "Hot keys and cross-shard queries"
stage = "quiz"
xp = 120
statement = """
A social app stores posts in 8 shards.

- Normal traffic is 80,000 reads per second, spread evenly over the shards.
- One shard can serve at most 15,000 reads per second.
- A celebrity's profile gets an extra 30,000 reads per second. They all go to Shard 2, which holds that account's key.
"""

[diagram]
nodes = [
  { id = "app", label = "App servers", at = [1, 0] },
  { id = "router", label = "Router", at = [1, 1] },
  { id = "s1", label = "Shard 1", at = [0, 2] },
  { id = "s2", label = "Shard 2", at = [1, 2] },
  { id = "s8", label = "Shard 8", at = [2, 2] },
]
links = [["app", "router"], ["router", "s1"], ["router", "s2"], ["router", "s8"]]

[[diagram.steps]]
flow = ["app", "router", "s1"]

[[diagram.steps]]
flow = ["app", "router", "s2"]
packets = 3

[[diagram.steps]]
flow = ["app", "router", "s8"]

[[questions]]
prompt = "Suppose posts are partitioned by creation time, and each shard holds one month. What goes wrong?"
choices = [
  "Reading one day of posts must ask all 8 shards",
  "All new posts go to the shard for the current month, so one shard takes every write",
  "Every key must be rehashed at the start of each month",
  "Range partitioning cannot store timestamps",
]
answer = 2
explanation = "With a range on time, the newest range gets all the writes and most of the reads, while the older shards sit idle. Range partitioning keeps ordered scans cheap, but only if its key spreads the current traffic. Partitioning by user id, then time, spreads the writes."

[[questions.steps]]
flow = ["app", "router", "s8"]
packets = 5
highlight = ["s8"]
labels = { s1 = "idle", s2 = "idle", s8 = "this month" }
caption = "Every new post lands on the newest range."

[[questions]]
prompt = "Posts are now hash-partitioned by user id. Which query has to ask all 8 shards?"
choices = [
  "All posts by one user",
  "One post, given its user id and post id",
  "The 100 newest posts from all users",
  "The number of posts by one user",
]
answer = 3
explanation = "All of a user's posts live on the shard that the user id hashes to, so queries by user go to one shard. The newest posts from everyone are spread over all shards. The router must ask every shard and merge the results: a scatter-gather query."

[[questions.steps]]
flow = ["app", "router", "s2"]
highlight = ["s1", "s2", "s8"]
labels = { router = "ask all 8" }
caption = "Without the shard key, a query goes to every shard."

[[questions]]
prompt = "A scatter-gather query asks all 8 shards in parallel. Seven answer in 10 ms and one answers in 80 ms. What is the latency of the query?"
answer = 80
tolerance = 0.1
unit = "ms"
explanation = "The router must wait for every shard, so parallel work costs as much as its slowest part: 80 ms. The more shards a query touches, the more likely one of them is slow. Choose shard keys so that common queries touch one shard."

[[questions.steps]]
flow = ["router", "s8"]
highlight = ["s8"]
labels = { s1 = "10 ms", s2 = "10 ms", s8 = "80 ms" }
caption = "The slowest shard sets the latency of the whole query."

[[questions]]
prompt = "How many reads per second does Shard 2 get?"
answer = 40000
tolerance = 0.1
unit = "reads per second"
hint = "Add the shard's even share of normal traffic to the celebrity's reads."
explanation = "Normal share: 80,000 / 8 = 10,000 reads per second. Add the celebrity's 30,000: 40,000 reads per second, which is 2.7 times the shard's limit of 15,000. Better hashing does not help, because all those reads are for one key."

[[questions.steps]]
flow = ["app", "router", "s2"]
packets = 5
down = ["s2"]
labels = { s1 = "10k/s", s2 = "10k + 30k", s8 = "10k/s" }
caption = "Even key spread cannot fix one key that gets far more traffic than the rest."

[[questions]]
prompt = "Copy the celebrity's data to k keys (user#0 to user#k-1) on k different shards, and send each read to a random copy. Each of those shards also serves its normal 10,000 reads per second. What is the smallest k that keeps every shard at or below 15,000 reads per second?"
answer = 6
tolerance = 0.1
unit = "copies"
hint = "Find the spare capacity of one shard, then divide the celebrity's reads by it."
explanation = "Each shard has 15,000 - 10,000 = 5,000 reads per second to spare. 30,000 / 5,000 = 6 copies, each taking 5,000 reads per second. A write to the celebrity's data must now update all 6 copies, so this suits keys that are read far more often than written."

[[questions.steps]]
flow = ["app", "router", "s1"]
packets = 3
highlight = ["s1", "s2", "s8"]
labels = { s1 = "10k + 5k", s2 = "10k + 5k", s8 = "10k + 5k" }
caption = "Six copies share the extra 30,000 reads: 5,000 each."
