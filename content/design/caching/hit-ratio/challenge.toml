id = "hit-ratio"
title = "Do the hit ratio arithmetic"
stage = "quiz"
xp = 100
statement = """
A product page service reads product data 20,000 times per second at the peak. It uses cache-aside.

- A cache hit takes 1 ms.
- A miss takes 21 ms in total: 1 ms to check the cache, then 20 ms to query the database.
- The hit ratio is 90%.
- The database can serve at most 5,000 reads per second.
"""

[diagram]
nodes = [
  { id = "users", label = "Users", at = [0, 0] },
  { id = "app", label = "App server", at = [1, 0] },
  { id = "cache", label = "Cache", at = [2, 0] },
  { id = "db", label = "Database", at = [1, 1] },
]
links = [["users", "app"], ["app", "cache"], ["app", "db"]]

[[diagram.steps]]
flow = ["users", "app", "cache"]
packets = 3

[[diagram.steps]]
flow = ["app", "db"]

[[questions]]
prompt = "What is the average latency of a read?"
answer = 3
tolerance = 0.1
unit = "ms"
hint = "Weight each path by how often it happens: hit share x hit latency + miss share x miss latency."
explanation = "0.9 x 1 ms + 0.1 x 21 ms = 0.9 + 2.1 = 3 ms. The rare misses add more to the average than all the hits together, so the miss path matters most."

[[questions.steps]]
flow = ["users", "app", "cache"]
packets = 4
labels = { cache = "0.9 x 1 ms" }
caption = "Hits: 90% of reads at 1 ms add 0.9 ms."

[[questions.steps]]
flow = ["app", "db"]
labels = { db = "0.1 x 21 ms" }
caption = "Misses: 10% of reads at 21 ms add 2.1 ms."

[[questions]]
prompt = "How many reads per second reach the database?"
answer = 2000
tolerance = 0.1
unit = "reads per second"
explanation = "Only misses reach the database: 20,000 x 0.1 = 2,000 reads per second. At 99% hits only 200 would. Going from 90% to 99% hits cuts the database load by 10 times."

[[questions.steps]]
flow = ["app", "db"]
packets = 2
highlight = ["db"]
labels = { cache = "18,000/s", db = "2,000/s" }
caption = "The cache absorbs 18,000 reads per second. The database sees only the misses."

[[questions]]
prompt = "What is the lowest hit ratio that keeps the database at or below its 5,000 reads per second? Give a percentage."
answer = 75
tolerance = 0.1
unit = "%"
hint = "First find the largest share of reads the database can take: 5,000 / 20,000."
explanation = "The database can take 5,000 / 20,000 = 25% of the reads as misses. So the hit ratio must be at least 100% - 25% = 75%. Below that, the database is overloaded even though the cache works."

[[questions.steps]]
flow = ["app", "db"]
packets = 3
highlight = ["db"]
labels = { cache = "75% hits", db = "5,000/s max" }
caption = "At 75% hits, misses are exactly 5,000 per second: the database's limit."

[[questions]]
prompt = "The cache restarts empty, so for a while every read misses. How many times its capacity does the database receive?"
answer = 4
tolerance = 0.1
unit = "times"
explanation = "With an empty cache, all 20,000 reads per second go to the database. 20,000 / 5,000 = 4 times its capacity. A cold cache can take the database down. Fill the cache before it takes traffic, or bring traffic back slowly."

[[questions.steps]]
flow = ["app", "db"]
packets = 5
down = ["db"]
labels = { cache = "empty", db = "20,000/s = 4x" }
caption = "Every read is a miss, and the database gets four times what it can serve."

[[questions]]
prompt = "A small cache holds 3 entries and uses LRU eviction. It starts empty, then serves reads in this order: A, B, C, A, D. Which entry does D evict?"
choices = ["A", "B", "C", "None: the cache grows to 4 entries"]
answer = 2
explanation = "After A, B, C, A, the order from least to most recently used is B, C, A. The second read of A made it recent again, so B is the least recently used, and D evicts B. LRU keeps the entries that are in use."

[[questions.steps]]
flow = ["app", "cache"]
highlight = ["cache"]
labels = { cache = "evict B" }
caption = "LRU keeps recent entries and drops the one unused for the longest time."
