id = "serial-parallel"
title = "Chains and spares"
stage = "quiz"
xp = 120
statement = """
A request passes through a load balancer, an app server and a database. Each part fails independently of the others.

- Load balancer: 99.99% available.
- Each app server: 99% available.
- Database: 99.5% available.

Rules:

- In a chain where every part must work, multiply the availabilities.
- With n copies where any one is enough, the group is down only when all copies are down: availability = 1 - (1 - a)^n.

Use 8,760 hours in a year.
"""

[diagram]
nodes = [
  { id = "lb", label = "Load balancer", at = [0, 0] },
  { id = "app1", label = "App server 1", at = [1, 0] },
  { id = "app2", label = "App server 2", at = [1, 1] },
  { id = "db", label = "Database", at = [2, 0] },
]
links = [["lb", "app1"], ["lb", "app2"], ["app1", "db"], ["app2", "db"]]

[[diagram.steps]]
flow = ["lb", "app1", "db"]
packets = 2

[[diagram.steps]]
flow = ["lb", "app2", "db"]
packets = 2

[[questions]]
prompt = "The service runs on one app server only. How many hours a year is the chain down?"
answer = 131.8
tolerance = 0.1
unit = "hours per year"
hint = "Multiply the three availabilities, subtract from 1, and multiply by 8,760."
explanation = "Availability: 0.9999 x 0.99 x 0.995 = 0.98495. Down: 1 - 0.98495 = 0.01505. 0.01505 x 8,760 = about 131.8 hours a year. For small failure rates, adding them gives nearly the same answer: 0.0001 + 0.01 + 0.005 = 0.0151."

[[questions.steps]]
flow = ["lb", "app1", "db"]
packets = 2
labels = { lb = "99.99%", app1 = "99%", db = "99.5%" }
caption = "A chain is weaker than its weakest part. Every part's downtime adds up."

[[questions]]
prompt = "Now two app servers run, and either one can serve. How many hours a year is the app tier itself down?"
answer = 0.876
tolerance = 0.1
unit = "hours per year"
hint = "Both must be down at the same time: multiply the two failure probabilities."
explanation = "Each server is down 1% of the time. Both are down together 0.01 x 0.01 = 0.0001 of the time. 0.0001 x 8,760 = 0.876 hours, about 53 minutes a year, down from 87.6 hours for one server. Two 99% servers make a 99.99% tier."

[[questions.steps]]
flow = ["lb", "app2", "db"]
down = ["app1"]
highlight = ["app2"]
labels = { app1 = "down 1%", app2 = "down 1%" }
caption = "Parallel copies multiply failure probabilities, which shrinks them fast."

[[questions]]
prompt = "With the two app servers, how many hours a year is the whole chain down?"
answer = 45.5
tolerance = 0.02
unit = "hours per year"
explanation = "App tier: 1 - 0.01^2 = 0.9999. Chain: 0.9999 x 0.9999 x 0.995 = 0.99480. Down: 0.00520 x 8,760 = about 45.5 hours a year. Most of it, 43.8 hours, now comes from the database."

[[questions.steps]]
flow = ["lb", "app1", "db"]
highlight = ["db"]
labels = { lb = "99.99%", app2 = "tier 99.99%", db = "99.5%" }
caption = "With the app tier fixed, the database dominates the downtime."

[[questions]]
prompt = "Which single change cuts the chain's downtime the most?"
choices = [
  "Add a third app server",
  "Add a database replica with automatic failover",
  "Add a second load balancer",
  "Buy faster app servers",
]
answer = 2
explanation = "The database causes about 43.8 of the 45.5 hours. A replica that takes over makes the database tier 1 - 0.005^2 = 99.9975%, and the chain falls to about 2 hours a year. A third app server or a second load balancer saves less than 1 hour each. Speed does not change availability."

[[questions.steps]]
flow = ["app1", "db"]
down = ["db"]
labels = { db = "single point" }
caption = "Find the single point of failure and add redundancy there first."

[[questions]]
prompt = "Both app servers sit in one rack with one shared power supply. Why is the 99.99% figure for the app tier wrong?"
choices = [
  "Two copies only help when they run on different hardware models",
  "The rack adds network latency, which lowers availability",
  "They no longer fail independently: the shared power supply takes both down",
  "The formula needs at least three copies to hold",
]
answer = 3
explanation = "1 - (1 - a)^n assumes independent failures. A shared power supply, switch or zone makes the copies fail together, so the tier is no better than that shared part. Spreading copies across racks or zones keeps their failures independent."

[[questions.steps]]
flow = ["lb", "app1"]
down = ["app1", "app2"]
labels = { app1 = "same rack", app2 = "same rack" }
caption = "Copies that share a failure cause fail together."
