id = "interval-scheduling"
title = "Fit the most intervals"
stage = "build"
xp = 160
complexity = "O(n log n)"
sizes = [100, 200, 400, 800]
statement = """
Each interval is [start, end) with start < end. Return the largest number of intervals you can keep so that no two overlap. Intervals that only touch, like [1, 3) and [3, 5), do not overlap.

Trying every subset is O(2^n), and comparing pairs is O(n^2). One greedy rule gives the optimum after a single sort: decide which interval to keep first, keep it, and never reconsider. Sorting builtins are allowed.
"""
hints = [
  "Of all the intervals you could keep first, pick the one that finishes earliest. It leaves the most room for everything after it, so no other first choice can do better.",
  "Sort by end (`key=lambda pair: pair[1]`), then scan once, keeping an interval whenever its start is at or after the end of the last one kept.",
]

[[view]]
var = "intervals"
as = "array"
pointers = ["i"]

[[view]]
var = "last_end"
as = "value"

[[view]]
var = "count"
as = "value"
