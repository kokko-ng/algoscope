id = "counting-sort"
title = "Sort by counting"
stage = "apply"
xp = 120
complexity = "O(n + k)"
forbid = ["sorted", "sort", "heapq", "bisect"]
statement = """
Every value is an integer from 0 to max_value. Return a new list with the values in ascending order.

Any sort that works by comparing pairs needs O(n log n) comparisons. When the values come from a small range you can skip comparisons entirely: tally how often each value occurs, then write the values back out in order. That costs O(n + k), where k is max_value.
"""
hints = [
  "Make a list of max_value + 1 zeros and use each value as an index into it.",
  "Walk the tally from 0 upward and emit each value as many times as it was counted.",
]

[[view]]
var = "values"
as = "array"

[[view]]
var = "counts"
as = "array"
pointers = ["value"]

[[view]]
var = "result"
as = "array"
