id = "stairs-walkthrough"
title = "Watch a table fill up"
stage = "watch"
xp = 40
complexity = "O(n)"
statement = """
How many ways are there to climb n stairs taking 1 or 2 at a time? Every route to stair i ends with a single step from i - 1 or a double step from i - 2, so ways(i) = ways(i - 1) + ways(i - 2).

Written as plain recursion, that formula calls itself twice per level and recomputes the same stairs over and over: about 1.6^n calls. Here `dp[i]` stores the answer for stair i, filled from the bottom up.

Watch `dp` fill from left to right. The recursion asks for ways(5) many times over. How often is `dp[5]` computed here, and why is it ready by the time anything needs it?
"""

[[view]]
var = "dp"
as = "array"
pointers = ["i"]

[[captions]]
line = 3
text = "The base case: there is one way to stand at the bottom, by taking no steps. Every other entry is built on it."

[[captions]]
line = 5
text = "Routes that end with a single step: one for each way to reach i - 1, which is already in the table."

[[captions]]
line = 7
text = "Add the routes that end with a double step. Both inputs sit to the left of i, so filling left to right means they are always ready."

[[captions]]
line = 8
text = "n + 1 entries, each filled once in constant time: O(n) instead of exponential."
