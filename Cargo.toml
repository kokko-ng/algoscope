[package]
name = "algoscope"
version = "0.2.0"
edition = "2024"
description = "A terminal workbench for data structures and algorithms: write Python, watch it run, profile it."
license = "MIT"
repository = "https://github.com/kokko-ng/algoscope"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
include_dir = "0.7.4"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
toml = "1.1.8"
unicode-width = "0.2.3"

[dev-dependencies]
insta = "1.49.0"

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Terminal geometry converts between usize, u16, i64 and f64 constantly; values are bounded by screen size.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
# x, y, w, h are the natural names in drawing code.
many_single_char_names = "allow"
# Binary crate: no public API to document.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stderr = "deny"
