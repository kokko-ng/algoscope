[package]
name = "algoscope"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
include_dir = "0.7.4"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
toml = "1.1.8"
unicode-width = "0.2.3"

[dev-dependencies]
insta = "1.49.0"
